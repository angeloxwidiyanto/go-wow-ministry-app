version: "3.9"

services:
  # ── Go API Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: wow_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - FRONTEND_URL=http://frontend:3000
    expose:
      - "8080"
    networks:
      - wow_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Next.js Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: wow_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      # Internal URL for Server Components calling Go directly (server-to-server)
      - INTERNAL_API_URL=http://backend:8080
    expose:
      - "3000"
    networks:
      - wow_network
    depends_on:
      backend:
        condition: service_healthy

  # ── Caddy Reverse Proxy ─────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: wow_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - wow_network
    depends_on:
      - frontend
      - backend

networks:
  wow_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
